name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing tag (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease)'
        required: true
        type: string
      release_name:
        description: 'Release title'
        required: true
        type: string
      release_body:
        description: 'Release description'
        default: 'Automated release.'
        type: string
      prerelease:
        description: 'Mark as prerelease'
        default: true
        type: boolean
      replace_existing:
        description: 'Replace an existing release after backing up its assets'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      release_exists: ${{ steps.release_check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve existing tag
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: python packaging/release.py prepare --tag "$RELEASE_TAG"
      - name: Check whether replacing an existing release is allowed
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > existing-tags.txt
          if grep -Fxq -- "$RELEASE_TAG" existing-tags.txt; then
            if [[ "$REPLACE_EXISTING" != true ]]; then
              echo "A release already exists for $RELEASE_TAG; replacement was not requested" >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
  macos:
    needs: prepare
    uses: ./.github/workflows/build_macos.yml
    with:
      source_sha: ${{ needs.prepare.outputs.commit }}
      version: ${{ needs.prepare.outputs.version }}
  windows:
    needs: prepare
    uses: ./.github/workflows/build_windows.yml
    with:
      source_sha: ${{ needs.prepare.outputs.commit }}
      version: ${{ needs.prepare.outputs.version }}
  linux:
    needs: prepare
    uses: ./.github/workflows/build_linux.yml
    with:
      source_sha: ${{ needs.prepare.outputs.commit }}
      version: ${{ needs.prepare.outputs.version }}
  publish:
    needs: [prepare, macos, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: RemoteMouse-*
          merge-multiple: true
          path: release-assets
      - name: Verify all build identities and checksums
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: python packaging/release.py verify --directory release-assets --version "$BUILD_VERSION" --commit "$SOURCE_SHA" --tag "$RELEASE_TAG"
      - name: Back up the existing release
        if: needs.prepare.outputs.release_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          mkdir -p previous-release/assets
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > previous-release/release.json
          gh release download "$RELEASE_TAG" --dir previous-release/assets
          cd previous-release/assets
          sha256sum --check SHA256SUMS.txt
      - name: Save the previous release for recovery
        if: needs.prepare.outputs.release_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: previous-release-${{ inputs.tag_name }}-${{ github.run_id }}
          path: previous-release/
          retention-days: 30
          if-no-files-found: error
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_TITLE: ${{ inputs.release_name }}
          RELEASE_BODY: ${{ inputs.release_body }}
          PRERELEASE: ${{ inputs.prerelease }}
          SOURCE_SHA: ${{ needs.prepare.outputs.commit }}
          RELEASE_EXISTS: ${{ needs.prepare.outputs.release_exists }}
        run: |
          printf '%s\n' "$RELEASE_BODY" > release-notes.txt
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          if [[ "$RELEASE_EXISTS" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft --verify-tag --target "$SOURCE_SHA" --title "$RELEASE_TITLE" --notes-file release-notes.txt --prerelease="$PRERELEASE"
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --target "$SOURCE_SHA" --title "$RELEASE_TITLE" --notes-file release-notes.txt "${flags[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
